<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>火箭与塔架 - 逃逸几何学 (模拟任务)</title>
    <!-- 引入 Tailwind CSS 用于辅助快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Inter 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        /* ==========================================
           全局重置与核心舞台基础设置
           ========================================== */
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050505; 
            font-family: 'Inter', sans-serif !important; 
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 核心舞台 1920x1080 */
        #stage {
            position: relative;
            width: 1920px;
            height: 1080px;
            /* 背景渐变：深海蓝 -> 深空黑 */
            background: radial-gradient(circle at center, #1A237E 0%, #050505 100%);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden;
            flex-shrink: 0;
            transform-origin: center center;
        }

        /* 全局背景网格与交点菱形点缀 */
        #stage::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><line x1='40' y1='0' x2='40' y2='80' stroke='rgba(255,255,255,0.05)' stroke-width='1'/><line x1='0' y1='40' x2='80' y2='40' stroke='rgba(255,255,255,0.05)' stroke-width='1'/><polygon points='40,37 43,40 40,43 37,40' fill='rgba(34,211,238,0.3)'/></svg>");
            background-size: 80px 80px;
            z-index: 0;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0.05) 100%);
            -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 30%, rgba(0,0,0,0.05) 100%);
        }

        /* --- A区：品牌区 --- */
        #brand-zone { position: absolute; top: 24px; left: 48px; z-index: 50; }
        #brand-zone h1 {
            margin: 0; font-size: 48px; font-weight: 800; letter-spacing: -1px;
            background: linear-gradient(135deg, #00AEEF 0%, #2A4B9A 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 174, 239, 0.3);
        }
        #brand-zone .subtitle { margin-top: 4px; font-size: 18px; color: #4DD0E1; font-weight: 500; letter-spacing: 2px; }

        /* --- B区：导航区 --- */
        #nav-zone { position: absolute; top: 140px; left: 48px; display: flex; flex-direction: column; gap: 12px; z-index: 50; width: 180px; }
        .mode-btn {
            padding: 12px 16px; background: rgba(26, 35, 126, 0.6); border: 2px solid #2A4B9A; color: #4DD0E1;
            font-size: 18px; font-weight: 600; text-align: left; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 12px; border-radius: 0; overflow: hidden;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .mode-btn:hover { background: rgba(42, 75, 154, 0.8); color: #FFFFFF; border-color: #00AEEF; }
        .mode-btn.active {
            background: linear-gradient(90deg, rgba(0,174,239,0.15) 0%, rgba(0,174,239,0) 100%);
            border-left: 8px solid #00AEEF; color: #00AEEF; font-weight: bold;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        /* --- C区：主视窗 --- */
        #viewport-zone {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            width: 1420px; height: 800px; background: #050505; border: 2px solid #2A4B9A;
            box-shadow: 0 0 60px rgba(0,0,0,0.6) inset, 0 20px 50px rgba(0,0,0,0.5); 
            z-index: 10; overflow: hidden;
        }
        .corner-marker { position: absolute; width: 20px; height: 20px; border-color: #00AEEF; border-style: solid; pointer-events: none; z-index: 20; opacity: 0.5; }
        .tl { top: 0; left: 0; border-width: 4px 0 0 4px; }
        .tr { top: 0; right: 0; border-width: 4px 4px 0 0; }
        .bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; }
        .br { bottom: 0; right: 0; border-width: 0 4px 4px 0; }

        /* 状态信息区 (放置在 C区 右上角) */
        #status-zone { position: absolute; top: 20px; right: 24px; z-index: 50; text-align: right; pointer-events: none; }
        .status-main { font-size: 32px; font-weight: 800; color: #FFFFFF; margin-bottom: 4px; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .status-sub { font-size: 18px; font-weight: 500; color: #4DD0E1; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; background: #00838F; margin-right: 12px; display: inline-block; vertical-align: middle; margin-top: -4px; }
        .status-dot.idle { background: #00838F; box-shadow: 0 0 10px #00838F; } 
        .status-dot.running { background: #FFC107; box-shadow: 0 0 10px #FFC107; } 
        .status-dot.success { background: #00E676; box-shadow: 0 0 10px #00E676; } 
        .status-dot.fail { background: #FF5252; box-shadow: 0 0 10px #FF5252; } 

        /* --- D区：工作区 --- */
        #control-deck {
            position: absolute; bottom: 0; left: 0; width: 1920px; height: 220px;
            background: transparent; border-top: none; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 5; padding: 0 48px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* 极浅弧线仪表盘组 */
        .slider-group {
            display: flex; flex-direction: row; justify-content: center; align-items: flex-end;
            width: 650px; flex-shrink: 0; 
            position: absolute; left: 50%; transform: translateX(-50%); bottom: 0;
        }
        
        .arc-container { position: relative; width: 600px; height: 160px; touch-action: none; transition: all 0.3s ease; }
        .arc-container svg { width: 100%; height: 100%; overflow: visible; }
        
        .arc-container.disabled-interaction { pointer-events: none; }
        .arc-container.locked { opacity: 0.3; filter: grayscale(1); }
        .arc-container.grey-out { opacity: 0.3; filter: grayscale(1); }
        
        .rs-bg { fill: none; stroke: rgba(224, 247, 250, 0.15); stroke-width: 2; stroke-linecap: butt; }
        .rs-hit { fill: none; stroke: transparent; stroke-width: 60; cursor: pointer; pointer-events: stroke; }

        .rs-fill-angle {
            fill: none; stroke: #FF5252; stroke-width: 4; stroke-linecap: butt;
            filter: drop-shadow(0 0 6px rgba(255, 82, 82, 0.6));
            transition: stroke-dashoffset 0.1s linear;
        }
        .rs-fill-speed {
            fill: none; stroke: #00AEEF; stroke-width: 4; stroke-linecap: butt;
            filter: drop-shadow(0 0 6px rgba(0, 174, 239, 0.6));
            transition: stroke-dashoffset 0.1s linear;
        }

        .rs-thumb {
            position: absolute; width: 32px; height: 32px; border-radius: 50%;
            pointer-events: none; top: 0; left: 0; transform: translate(-50%, -50%);
            transition: left 0.1s linear, top 0.1s linear; z-index: 10;
        }
        #thumb-angle { border: 4px solid #FF5252; background: rgba(255, 82, 82, 0.5); box-shadow: 0 0 10px rgba(255, 82, 82, 0.5); }
        #thumb-speed { border: 4px solid #00AEEF; background: rgba(0, 174, 239, 0.5); box-shadow: 0 0 10px rgba(0, 174, 239, 0.5); }

        .arc-labels {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            display: flex; gap: 60px; text-align: center; pointer-events: none;
        }
        .c-label { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
        .c-label span { 
            display: block; font-size: 32px; font-weight: 400; 
            font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums;
            letter-spacing: 2px; margin-top: 6px; line-height: 1; 
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* 按钮通用样式 */
        .circle-btn {
            position: relative; border-radius: 50%;
            background: rgba(26, 35, 126, 0.9); border: 2px solid rgba(42, 75, 154, 0.8);
            color: #4DD0E1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none; flex-shrink: 0; backdrop-filter: blur(8px);
            font-family: 'Inter', sans-serif; box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        
        .circle-btn::after {
            content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; 
            border-radius: 50%; border: 4px solid transparent; pointer-events: none; transition: all 0.2s ease; z-index: 10;
        }
        
        .circle-btn:active { transform: translateY(-2px) !important; }
        .circle-btn.locked { opacity: 0.3; pointer-events: none; filter: grayscale(1); }

        /* r=100px的小型圆形按钮 (常规功能) */
        .circle-btn.small {
            font-weight: 600; font-size: 14px;
            width: 100px; height: 100px; 
        }
        .circle-btn.small .icon { font-size: 28px; margin-bottom: 4px; display: block; }
        .circle-btn.small:hover {
            background: #2A4B9A; color: #FFFFFF; transform: translateY(-4px); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); border-color: #00AEEF;
        }
        .circle-btn.small:hover::after { border-color: #00AEEF; }
        
        /* 巨大点火按钮的特殊 Danger 样式 (套用 small red) */
        .circle-btn.small.red {
            border-color: #FF5252; color: #FF5252; background: rgba(26, 35, 126, 0.9);
        }
        .circle-btn.small.red:hover {
            background: #E91E63; color: #FFFFFF; transform: translateY(-4px); 
            box-shadow: 0 15px 35px rgba(255, 82, 82, 0.6); border-color: #FF5252;
        }
        .circle-btn.small.red:hover::after { border-color: #FF5252; background-color: rgba(255, 82, 82, 0.15); }

        /* 视角切换按钮 (统一为 r=100px) */
        .circle-btn.mini {
            font-weight: 600; font-size: 14px; letter-spacing: 1px;
            width: 100px; height: 100px;
        }
        .circle-btn.mini .icon { font-size: 28px; margin-bottom: 4px; display: block; }
        .circle-btn.mini:hover {
            background: #2A4B9A; color: #FFFFFF; transform: translateY(-4px); 
            border-color: #00AEEF;
        }
        .circle-btn.mini:hover::after { border-color: #00AEEF; }
        
        /* 视角切换按钮的激活状态 */
        .circle-btn.mini.active {
            background: rgba(0, 174, 239, 0.15); color: #00AEEF; border-color: transparent;
            box-shadow: 0 0 25px rgba(0, 174, 239, 0.5);
        }
        .circle-btn.mini.active::after { border-color: #00AEEF; }

        /* --- E区：任务简报/结果弹窗 --- */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.75); backdrop-filter: blur(12px);
            z-index: 999; display: flex; justify-content: center; align-items: center;
            opacity: 1; transition: opacity 0.5s ease; pointer-events: auto;
        }
        .modal-overlay.hidden { opacity: 0; pointer-events: none; }
        .modal-content {
            width: 800px; background: rgba(26, 35, 126, 0.85); border: 2px solid #2A4B9A;
            padding: 64px 56px; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            transform: translateY(0) scale(1); 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border-top: 8px solid #00AEEF;
        }
        .modal-overlay.hidden .modal-content { transform: translateY(20px) scale(0.95); }
        .modal-title { font-size: 40px; color: #FFFFFF; margin-bottom: 24px; font-weight: 900; letter-spacing: 2px; }
        .modal-desc { font-size: 20px; color: #E0F7FA; line-height: 1.8; margin-bottom: 40px; font-weight: 500; }
        .modal-desc strong { color: #00AEEF; font-weight: 700; }
        .modal-btn {
            background: rgba(0, 174, 239, 0.1); border: 2px solid #00AEEF; color: #00AEEF;
            padding: 16px 48px; font-size: 20px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; font-family: 'Inter', sans-serif; letter-spacing: 2px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .modal-btn:hover { background: rgba(0, 174, 239, 0.25); box-shadow: 0 12px 25px rgba(0, 174, 239, 0.6); color: #FFFFFF; }

        /* --- 交互动效：拖拽暗示呼吸光晕 --- */
        @keyframes hint-pulse-angle {
            0% { box-shadow: 0 0 10px rgba(255, 82, 82, 0.5), 0 0 0 0 rgba(255, 82, 82, 0.8); }
            70% { box-shadow: 0 0 10px rgba(255, 82, 82, 0.5), 0 0 0 20px rgba(255, 82, 82, 0); }
            100% { box-shadow: 0 0 10px rgba(255, 82, 82, 0.5), 0 0 0 0 rgba(255, 82, 82, 0); }
        }
        @keyframes hint-pulse-speed {
            0% { box-shadow: 0 0 10px rgba(0, 174, 239, 0.5), 0 0 0 0 rgba(0, 174, 239, 0.8); }
            70% { box-shadow: 0 0 10px rgba(0, 174, 239, 0.5), 0 0 0 20px rgba(0, 174, 239, 0); }
            100% { box-shadow: 0 0 10px rgba(0, 174, 239, 0.5), 0 0 0 0 rgba(0, 174, 239, 0); }
        }
        @keyframes hint-pulse-btn {
            0% { box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 0 0 rgba(0, 174, 239, 0.8); }
            70% { box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 0 20px rgba(0, 174, 239, 0); }
            100% { box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 0 0 rgba(0, 174, 239, 0); }
        }
        .hint-anim-angle { animation: hint-pulse-angle 1.5s infinite; }
        .hint-anim-speed { animation: hint-pulse-speed 1.5s infinite; }
        .hint-anim-btn { animation: hint-pulse-btn 1.5s infinite; }

    </style>
</head>
<body>

    <div id="stage">
        <!-- A区：品牌 -->
        <div id="brand-zone">
            <h1>逃逸几何学</h1>
            <div class="subtitle">零秒脱落模拟分析终端</div>
        </div>

        <!-- B区：导航 -->
        <div id="nav-zone">
            <button class="mode-btn active" id="btn-observe" onclick="switchAppMode('observe')"><span>👀</span> 观察模式</button>
            <button class="mode-btn" id="btn-game" onclick="switchAppMode('game')"><span>🎮</span> 游戏模式</button>
            <div style="height: 1px; background: rgba(42, 75, 154, 0.8); margin: 8px 0;"></div>
            <button class="mode-btn" onclick="showBriefing()"><span>ℹ️</span> 任务简报</button>
        </div>

        <!-- C区：主视窗 -->
        <div id="viewport-zone">
            <div class="corner-marker tl"></div><div class="corner-marker tr"></div>
            <div class="corner-marker bl"></div><div class="corner-marker br"></div>
            
            <div id="status-zone">
                <div id="status-text" class="status-main"><span id="status-dot" class="status-dot idle"></span>系统待机</div>
                <div id="status-desc" class="status-sub">观察模式：点击自动演示，观察标准脱落时序</div>
            </div>
        </div>

        <!-- D区：工作区 (Control Deck) -->
        <div id="control-deck">
            
            <!-- 左侧动作组与视角组 (间距 24px) -->
            <div class="left-controls" style="flex: 1; display: flex; justify-content: flex-start; align-items: center; gap: 24px;">
                
                <!-- 动作按键占位区 (100px固定) -->
                <div style="position: relative; width: 100px; height: 100px;">
                    <div class="circle-btn small" id="autoDemoBtn" style="position: absolute; top:0; left:0; width: 100%; height: 100%;">
                        <span class="icon">▶</span> 自动演示
                    </div>
                    <div class="circle-btn small red" id="igniteBtn" style="position: absolute; top:0; left:0; width: 100%; height: 100%; display: none;">
                        <span class="icon">🚀</span> 点火发射
                    </div>
                </div>

                <!-- 视角切换器左半部：斜视、俯视 -->
                <div class="circle-btn mini view-btn active" id="view-iso" onclick="setCameraView('iso')">
                    <span class="icon">📐</span> 斜视
                </div>
                <div class="circle-btn mini view-btn" id="view-top" onclick="setCameraView('top')">
                    <span class="icon">🚁</span> 俯视
                </div>
            </div>

            <!-- 中间：浅弧仪表盘 -->
            <div class="slider-group">
                <div class="arc-container" id="arc-sliders">
                    <svg viewBox="0 0 600 160">
                        <circle cx="300" cy="600" r="600" class="rs-bg" transform="rotate(225 300 600)" stroke-dasharray="942.48 4000" />
                        <circle cx="300" cy="600" r="600" class="rs-fill-angle" id="fill-angle" />
                        <circle cx="300" cy="600" r="600" class="rs-hit" id="hit-angle" transform="rotate(225 300 600)" stroke-dasharray="942.48 4000" />

                        <circle cx="300" cy="600" r="540" class="rs-bg" transform="rotate(225 300 600)" stroke-dasharray="848.23 4000" />
                        <circle cx="300" cy="600" r="540" class="rs-fill-speed" id="fill-speed" />
                        <circle cx="300" cy="600" r="540" class="rs-hit" id="hit-speed" transform="rotate(225 300 600)" stroke-dasharray="848.23 4000" />
                        
                        <g transform="translate(300, 600)">
                            <circle cx="0" cy="-600" r="3" fill="#050505" stroke="#FF5252" stroke-width="1.5" transform="rotate(-27.71)" />
                            <circle cx="0" cy="-600" r="3" fill="#050505" stroke="#FF5252" stroke-width="1.5" />
                            <circle cx="0" cy="-600" r="3" fill="#050505" stroke="#FF5252" stroke-width="1.5" transform="rotate(27.71)" />
                        </g>

                        <g transform="translate(300, 600)">
                            <circle cx="0" cy="-540" r="3" fill="#050505" stroke="#00AEEF" stroke-width="1.5" transform="rotate(-27.45)" />
                            <circle cx="0" cy="-540" r="3" fill="#050505" stroke="#00AEEF" stroke-width="1.5" />
                            <circle cx="0" cy="-540" r="3" fill="#050505" stroke="#00AEEF" stroke-width="1.5" transform="rotate(27.45)" />
                        </g>
                    </svg>

                    <div class="rs-thumb" id="thumb-angle"></div>
                    <div class="rs-thumb" id="thumb-speed"></div>

                    <div class="arc-labels">
                        <div class="c-label" style="color:#FF5252">目标开角<span id="val-angle" style="color:#FF5252">0°</span></div>
                        <div class="c-label" style="color:#00AEEF">撤离速度<span id="val-speed" style="color:#00AEEF">极速</span></div>
                    </div>
                </div>
            </div>

            <!-- 右侧动作组与视角组 (间距 24px) -->
            <div class="right-controls" style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 24px;">
                <!-- 视角切换器右半部：正面、侧面 -->
                <div class="circle-btn mini view-btn" id="view-front" onclick="setCameraView('front')">
                    <span class="icon">🔲</span> 正面
                </div>
                <div class="circle-btn mini view-btn" id="view-side" onclick="setCameraView('side')">
                    <span class="icon">👁️</span> 侧面
                </div>
                
                <div class="circle-btn small" id="resetBtn">
                    <span class="icon">↻</span> 重置场景
                </div>
            </div>

        </div>

        <!-- E区：任务简报 / 结果弹窗 -->
        <div id="mission-briefing" class="modal-overlay hidden">
            <div class="modal-content" id="modal-box">
                <div id="modal-title" class="modal-title">任务简报：零秒脱落</div>
                <div id="modal-desc" class="modal-desc">
                    指挥官，火箭起飞就像一场必须精确到毫秒的分手。在点火前 0 秒，庞大的机械臂必须瞬间脱落。<br><br>
                    根据发射场安全守则，摆杆撤离的开角<strong>必须达到 30°</strong> 才能避开火箭主体免受碰撞；而<strong>必须达到 45°</strong> 才能完全贴合塔架，避免被高温尾焰烧毁。<br><br>
                    请在下方控制台设定合理的<strong>开角与速度</strong>，确保发射安全！
                </div>
                <button id="modal-btn" class="modal-btn" onclick="dismissModal()">[ 接收任务 / 进入控制台 ]</button>
            </div>
        </div>

    </div>

    <script>
        // --- 0. 屏幕缩放适配 (1920x1080 核心舞台) ---
        function fitStage() {
            const stage = document.getElementById('stage');
            const targetW = 1920, targetH = 1080;
            const scale = Math.min(window.innerWidth / targetW, window.innerHeight / targetH);
            stage.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', fitStage);
        fitStage(); 

        // --- 全局状态机 ---
        let appMode = 'observe'; 
        let gameState = 'IDLE'; 
        let currentArmAngle = 0; let targetArmAngle = -90; let armOpenSpeed = 0; 
        let modalShown = false; 
        
        let gameTimeout = null; 
        let ignitionFrames = 0; 
        let isDemoPaused = false; 

        let hasClickedDemo = false; 
        let hasDraggedSliders = false;

        // --- UI 弹窗逻辑 ---
        const overlay = document.getElementById('mission-briefing');

        // --- 3. 几何体构建 ---
        function createFlagTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 300; canvas.height = 200;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#de2910'; ctx.fillRect(0, 0, 300, 200);
            ctx.fillStyle = '#ffde00'; 
            function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3; let x = cx, y = cy, step = Math.PI / spikes;
                ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius; ctx.lineTo(x, y); rot += step;
                    x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius; ctx.lineTo(x, y); rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fill();
            }
            const s = 300 / 288; drawStar(48*s, 48*s, 5, 28*s, 11*s); 
            const sr = 9*s; const si = 3.5*s;
            ctx.save(); ctx.translate(96*s, 19*s); ctx.rotate(Math.atan2(19-48, 96-48) + Math.PI/2); drawStar(0, 0, 5, sr, si); ctx.restore();
            ctx.save(); ctx.translate(115*s, 48*s); ctx.rotate(Math.atan2(48-48, 115-48) + Math.PI/2); drawStar(0, 0, 5, sr, si); ctx.restore();
            ctx.save(); ctx.translate(115*s, 86*s); ctx.rotate(Math.atan2(86-48, 115-48) + Math.PI/2); drawStar(0, 0, 5, sr, si); ctx.restore();
            ctx.save(); ctx.translate(96*s, 115*s); ctx.rotate(Math.atan2(115-48, 96-48) + Math.PI/2); drawStar(0, 0, 5, sr, si); ctx.restore();
            const tex = new THREE.CanvasTexture(canvas); tex.anisotropy = 16; return tex;
        }

        function createVonKarmanGeometry(R, L, segments) {
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments; const x = t * L;
                if (t === 0) points.push(new THREE.Vector2(0, L)); 
                else if (t === 1) points.push(new THREE.Vector2(R, 0)); 
                else {
                    const theta = Math.acos(1 - (2 * x) / L);
                    const r = (R / Math.sqrt(Math.PI)) * Math.sqrt(theta - 0.5 * Math.sin(2 * theta));
                    points.push(new THREE.Vector2(r, (1 - t) * L));
                }
            }
            return new THREE.LatheGeometry(points, 32);
        }

        // --- 烧毁烟雾特效生成函数 ---

                    ),
                    rotSpeed: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.2,
                        (Math.random() - 0.5) * 0.2,
                        (Math.random() - 0.5) * 0.2
                    ),
                    scaleSpeed: Math.random() * 0.02 + 1.02,
                    life: 1.0,
                    decay: 0.008 // 烟雾消散得慢一点
                };
                smokeGroup.add(mesh);
            }
            
            smokeGroup.position.set(x, y, z);
            scene.add(smokeGroup);
            explosions.push({ type: 'group', mesh: smokeGroup });
        }

        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                
                if (exp.type === 'points') {
                    exp.life -= 0.01;
                    if (exp.life <= 0) {
                        scene.remove(exp.mesh);
                        exp.mesh.geometry.dispose();
                        exp.mesh.material.dispose();
                        explosions.splice(i, 1);
                        continue;
                    }
                    const positions = exp.mesh.geometry.attributes.position.array;
                    for (let j = 0; j < exp.velocities.length; j++) {
                        positions[j * 3] += exp.velocities[j].x;
                        positions[j * 3 + 1] += exp.velocities[j].y;
                        positions[j * 3 + 2] += exp.velocities[j].z;
                        
                        exp.velocities[j].y -= 0.15; // 重力
                        exp.velocities[j].x *= 0.98; // 阻力
                        exp.velocities[j].z *= 0.98;
                    }
                    exp.mesh.geometry.attributes.position.needsUpdate = true;
                    exp.mesh.material.opacity = Math.max(0, exp.life * 1.5);
                } 
                else if (exp.type === 'flash') {
                    exp.life -= 0.08;
                    const scale = 1 + (1 - exp.life) * 2;
                    exp.mesh.scale.set(scale, scale, scale);
                    exp.mesh.material.opacity = exp.life;
                    if (exp.life <= 0) {
                        scene.remove(exp.mesh);
                        exp.mesh.geometry.dispose();
                        exp.mesh.material.dispose();
                        explosions.splice(i, 1);
                    }
                }
                else if (exp.type === 'group') {
                    let allDead = true;
                    exp.mesh.children.forEach(particle => {
                        particle.position.add(particle.userData.velocity);
                        particle.rotation.x += particle.userData.rotSpeed.x;
                        particle.rotation.y += particle.userData.rotSpeed.y;
                        particle.scale.multiplyScalar(particle.userData.scaleSpeed);
                        
                        particle.userData.life -= particle.userData.decay;
                        particle.material.opacity = Math.max(0, particle.userData.life);
                        
                        if (particle.userData.life > 0) allDead = false;
                    });
                    
                    if (allDead) {
                        scene.remove(exp.mesh);
                        explosions.splice(i, 1);
                    }
                }
            }
        }

        // --- 7. UI 控制与弧形滑杆逻辑 ---
        function initArcSlider(hitId, fillId, thumbId, radius, initialValue, onUpdate) {
            const hitEl = document.getElementById(hitId);
            const fillEl = document.getElementById(fillId);
            const thumbEl = document.getElementById(thumbId);
            const container = document.getElementById('arc-sliders');

            let currentValue = initialValue; 
            let isDragging = false;

            const trackStartAngleDeg = 240;
            const trackSweepAngleDeg = 60;
            const offsetPx = 24;
            const offsetDeg = (offsetPx / radius) * (180 / Math.PI);
            
            const startAngleDeg = trackStartAngleDeg + offsetDeg;
            const sweepAngleDeg = trackSweepAngleDeg - 2 * offsetDeg;
            const pathLength = (sweepAngleDeg / 360) * 2 * Math.PI * radius;

            fillEl.setAttribute('transform', `rotate(${startAngleDeg} 300 600)`);
            fillEl.setAttribute('stroke-dasharray', `${pathLength} 4000`);

            function updateUI(val, isUserInput = false) {
                currentValue = Math.max(0, Math.min(1, val));
                fillEl.style.strokeDashoffset = pathLength * (1 - currentValue);

                let currentAngleDeg = startAngleDeg + currentValue * sweepAngleDeg;
                let currentAngleRad = currentAngleDeg * Math.PI / 180;
                let tx = 300 + radius * Math.cos(currentAngleRad);
                let ty = 600 + radius * Math.sin(currentAngleRad);

                thumbEl.style.left = `${(tx / 600) * 100}%`;
                thumbEl.style.top = `${(ty / 160) * 100}%`;
                
                if (onUpdate) onUpdate(currentValue);
            }

            function handlePointer(e) {
                if (!isDragging && e.type !== 'pointerdown') return;
                
                const rect = container.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + (600 / 160) * rect.height;

                let dx = e.clientX - cx; let dy = e.clientY - cy;
                let angle = Math.atan2(dy, dx) * 180 / Math.PI;
                if (angle < 0) angle += 360; 

                let val = (angle - startAngleDeg) / sweepAngleDeg;
                if (val < -0.1) val = 0; 
                if (val > 1.1) val = 1;

                updateUI(val, true);
            }

            hitEl.addEventListener('pointerdown', (e) => {
                if(container.classList.contains('disabled-interaction')) return;
                isDragging = true;
                
                if (appMode === 'game') {
                    hasDraggedSliders = true;
                    updateUIHints();
                }

                hitEl.setPointerCapture(e.pointerId);
                fillEl.style.transition = 'none'; thumbEl.style.transition = 'none';
                handlePointer(e);
            });
            hitEl.addEventListener('pointermove', handlePointer);
            hitEl.addEventListener('pointerup', (e) => {
                isDragging = false;
                hitEl.releasePointerCapture(e.pointerId);
                fillEl.style.transition = 'stroke-dashoffset 0.1s linear';
                thumbEl.style.transition = 'left 0.1s linear, top 0.1s linear';
            });

            updateUI(initialValue); 
            return { setValue: (val) => updateUI(val, false), getValue: () => currentValue };
        }

        const sliderAngle = initArcSlider('hit-angle', 'fill-angle', 'thumb-angle', 600, 0.0, (val) => {
            let deg = Math.round(val * 90);
            const el = document.getElementById('val-angle');
            el.innerText = deg + '°';
            
            // --- 更新分水岭颜色判断规则 30° / 45° ---
            if(deg < 30) el.style.color = '#FF5252';
            else if(deg < 45) el.style.color = '#FFC107';
            else el.style.color = '#00E676';

            if (gameState === 'IDLE') {
                armsList.forEach(arm => arm.update(-deg * (Math.PI / 180)));
            }
        });

        const sliderSpeed = initArcSlider('hit-speed', 'fill-speed', 'thumb-speed', 540, 1.0, (val) => {
            const el = document.getElementById('val-speed');
            if (val < 0.33) { el.innerText = '慢速'; el.style.color = '#FF5252'; } 
            else if (val < 0.66) { el.innerText = '中速'; el.style.color = '#FFC107'; } 
            else { el.innerText = '极速'; el.style.color = '#00E676'; }
        });

        const igniteBtn = document.getElementById('igniteBtn'); 
        const autoDemoBtn = document.getElementById('autoDemoBtn'); 
        const resetBtn = document.getElementById('resetBtn');

        // --- 核心重置逻辑 ---
        function resetScene() {
            clearTimeout(gameTimeout); 
            isDemoPaused = false;
            ignitionFrames = 0;
            gameState = 'IDLE'; 
            rocketWrapper.position.y = 0;
            rocketWrapper.visible = true; // 重置时确保火箭可见
            currentArmAngle = 0; 
            
            // 清理遗留爆炸特效
            explosionTimeouts.forEach(clearTimeout);
            explosionTimeouts = [];
            explosions.forEach(exp => {
                if (exp.mesh) scene.remove(exp.mesh);
                if (exp.mesh && exp.mesh.geometry) exp.mesh.geometry.dispose();
                if (exp.mesh && exp.mesh.material) exp.mesh.material.dispose();
            });
            explosions.length = 0;

            sliderAngle.setValue(0); 
            armsList.forEach(arm => arm.update(0));
            
            if (appMode === 'observe') {
                sliderSpeed.setValue(1.0); 
                document.getElementById('arc-sliders').classList.add('grey-out');
                document.getElementById('arc-sliders').classList.add('disabled-interaction');
                updateUIStatus('IDLE', "观察模式", "点击自动演示，观察标准脱落时序", "idle");
            } else {
                sliderSpeed.setValue(0.0); 
                document.getElementById('arc-sliders').classList.remove('grey-out');
                document.getElementById('arc-sliders').classList.remove('disabled-interaction');
                updateUIStatus('IDLE', "系统待机", "设定脱落开角与速度，按下 IGNITION 点火", "idle");
            }

            globalArmMat.color.setHex(0xc2410c); 
            scene.position.set(0,0,0); 
            flamesList.forEach(f => f.group.visible = false);
            
            igniteBtn.classList.remove('locked');
            
            autoDemoBtn.classList.remove('locked'); 
            autoDemoBtn.innerHTML = '<span class="icon">▶</span> 自动演示';
            
            modalShown = false; 
            overlay.classList.add('hidden'); 
        }

        // --- 模式切换控制 ---
        window.switchAppMode = function(newMode) {
            if (appMode === newMode && gameState === 'IDLE') return; 

            appMode = newMode;
            hasClickedDemo = false;
            hasDraggedSliders = false;

            document.getElementById('btn-observe').classList.toggle('active', newMode === 'observe');
            document.getElementById('btn-game').classList.toggle('active', newMode === 'game');
            
            if (newMode === 'observe') {
                igniteBtn.style.display = 'none';
                autoDemoBtn.style.display = 'flex'; 
            } else {
                igniteBtn.style.display = 'flex'; 
                autoDemoBtn.style.display = 'none';
            }

            resetScene();
            updateUIHints();
        }

        resetBtn.onclick = resetScene;

        autoDemoBtn.onclick = () => {
            hasClickedDemo = true;
            updateUIHints();

            if (appMode !== 'observe' || gameState === 'DEMO_DONE') return;
            
            if (gameState === 'IDLE') {
                currentArmAngle = 0; armsList.forEach(arm => arm.update(0));
                sliderAngle.setValue(0); 
                rocketWrapper.position.y = 0; 
                
                modalShown = false; 
                isDemoPaused = false;
                ignitionFrames = 0; 
                gameState = 'DEMO_IGNITION';
                
                updateUIStatus('running', "主引擎点火 (T-3s)", "推力蓄压中，摆杆维持抱紧状态...", "running");
                
                autoDemoBtn.innerHTML = '<span class="icon">⏸</span> 暂停演示';
                
                document.getElementById('arc-sliders').classList.remove('grey-out');
                document.getElementById('arc-sliders').classList.add('disabled-interaction');
            } 
            else if (gameState === 'DEMO_IGNITION' || gameState === 'DEMO_LIFTOFF') {
                isDemoPaused = !isDemoPaused;
                
                if (isDemoPaused) {
                    autoDemoBtn.innerHTML = '<span class="icon">▶</span> 继续演示';
                    updateUIStatus('idle', "演示已暂停", "时间冻结，可拖拽画面或切换视角进行观察", "idle");
                } else {
                    autoDemoBtn.innerHTML = '<span class="icon">⏸</span> 暂停演示';
                    if (gameState === 'DEMO_IGNITION') {
                        updateUIStatus('running', "主引擎点火 (T-3s)", "推力蓄压中，摆杆维持抱紧状态...", "running");
                    } else {
                        updateUIStatus('running', "零秒脱落！", "起飞许可下达，摆杆极速撤离！", "running");
                    }
                }
            }
        };

        igniteBtn.onclick = () => {
            if (gameState !== 'IDLE' || appMode !== 'game') return;
            
            currentArmAngle = 0; armsList.forEach(arm => arm.update(0));
            targetArmAngle = -Math.round(sliderAngle.getValue() * 90); 
            
            let sval = sliderSpeed.getValue();
            if(sval < 0.33) armOpenSpeed = 0.125; 
            else if(sval < 0.66) armOpenSpeed = 0.45; 
            else armOpenSpeed = 1.25; 
            
            modalShown = false; 
            
            gameState = 'PRE_LAUNCH';
            updateUIStatus('running', "系统锁定", "摆杆归位抱死，倒计时准备发射...", "running");
            igniteBtn.classList.add('locked');
            document.getElementById('arc-sliders').classList.add('locked');

            gameTimeout = setTimeout(() => {
                if (gameState === 'PRE_LAUNCH') {
                    gameState = 'LAUNCHING';
                    updateUIStatus('running', "发射序列执行中", "火箭主引擎已点火升空", "running");
                }
            }, 1000); 
        };

        // --- 8. 动画与物理判定引擎 ---
        function animate() {
            requestAnimationFrame(animate);
            
            updateExplosions(); // 更新爆炸特效
            
            // 处理视角的平滑转场动画
            if (isCameraMoving) {
                // 转场时禁用阻尼，避免抢夺控制权
                controls.enabled = false;
                camera.position.lerp(targetCameraPos, 0.08);
                camera.lookAt(controls.target);
                
                if (camera.position.distanceTo(targetCameraPos) < 0.5) {
                    camera.position.copy(targetCameraPos);
                    controls.enabled = true;
                    isCameraMoving = false;
                }
            } else {
                controls.update(); 
            }

            let showFlames = ['LAUNCHING', 'SUCCESS', 'BURNED', 'DEMO_IGNITION', 'DEMO_LIFTOFF', 'DEMO_DONE'].includes(gameState);

            if (showFlames) {
                flamesList.forEach(f => {
                    f.group.visible = true; 
                    if (!isDemoPaused) {
                        f.outer.scale.set(0.9 + Math.random() * 0.2, 0.8 + Math.random() * 0.5, 0.9 + Math.random() * 0.2);
                        f.inner.scale.set(0.9 + Math.random() * 0.2, 0.8 + Math.random() * 0.5, 0.9 + Math.random() * 0.2);
                    }
                });
            } else {
                flamesList.forEach(f => f.group.visible = false);
            }

            if (!isDemoPaused) {
                if (gameState === 'DEMO_IGNITION') {
                    ignitionFrames++;
                    scene.position.x = (Math.random() - 0.5) * 0.15;
                    scene.position.y = (Math.random() - 0.5) * 0.15;

                    if (ignitionFrames >= 180) {
                        gameState = 'DEMO_LIFTOFF';
                        scene.position.set(0,0,0); 
                        updateUIStatus('running', "零秒脱落！", "起飞许可下达，摆杆极速撤离！", "running");
                    }
                } 
                else if (gameState === 'DEMO_LIFTOFF' || gameState === 'DEMO_DONE') {
                    if (gameState === 'DEMO_LIFTOFF') {
                        if (currentArmAngle > -90) {
                            currentArmAngle -= 1.25; 
                            if (currentArmAngle < -90) currentArmAngle = -90;
                            armsList.forEach(arm => arm.update(currentArmAngle * (Math.PI / 180)));
                            
                            sliderAngle.setValue(Math.abs(currentArmAngle) / 90);
                        } 
                        let upwardSpeed = 0.2;
                        if (rocketWrapper.position.y > 20) {
                            upwardSpeed = 0.2 * Math.pow(1.04, rocketWrapper.position.y - 20);
                        }
                        rocketWrapper.position.y += upwardSpeed;
                        
                        if (rocketWrapper.position.y > 130) {
                            gameState = 'DEMO_DONE';
                            updateUIStatus('IDLE', "演示完成", "完美的零秒脱落时序！可点击重置场景返回", "success");
                            
                            autoDemoBtn.classList.add('locked');
                            autoDemoBtn.innerHTML = '<span class="icon">▶</span> 自动演示';
                        }
                    } else if (gameState === 'DEMO_DONE') {
                        let upwardSpeed = 0.2 * Math.pow(1.04, rocketWrapper.position.y - 20);
                        rocketWrapper.position.y += upwardSpeed; 
                    }
                }
            }

            // --- 游戏闯关模式逻辑 (不受暂停影响) ---
            if (gameState === 'LAUNCHING' || gameState === 'SUCCESS' || gameState === 'BURNED') {
                if (currentArmAngle > targetArmAngle) {
                    currentArmAngle -= armOpenSpeed;
                    if (currentArmAngle < targetArmAngle) currentArmAngle = targetArmAngle;
                    armsList.forEach(arm => arm.update(currentArmAngle * (Math.PI / 180)));
                }

                let upwardSpeed = 0.2; 
                if (rocketWrapper.position.y > 20) {
                    upwardSpeed = 0.2 * Math.pow(1.04, rocketWrapper.position.y - 20);
                }
                rocketWrapper.position.y += upwardSpeed; 
                let dy = rocketWrapper.position.y; 

                if (gameState === 'LAUNCHING') {
                    // --- 物理碰撞判定：高度 8~30 的危险区 ---
                    if (dy > 8 && dy < 30) {
                        if (currentArmAngle > -30) {
                            if (gameState !== 'CRASHED') {
                                gameState = 'CRASHED';
                                updateUIStatus(gameState, "致命碰撞", "摆杆未能及时避让火箭主体", "fail");
                                createExplosion(-4, dy + 20, 0);
                                gameTimeout = setTimeout(() => {
                                    if (gameState === 'CRASHED' && !modalShown) {
                                        modalShown = true;
                                        showResult('💥 任务失败：致命碰撞！', '开角不足 30° 或撤离过慢，摆杆未能避开火箭主体，直接撞碎了塔架！重症监护室拔管失败！', 'fail');
                                    }
                                }, 3000); 
                            }
                        }
                    } 
                    // --- 尾焰烧毁判定：高度 30~60 的危险区 ---
                    else if (dy >= 30 && dy < 60) {
                        if (currentArmAngle > -45) {
                            if (gameState !== 'BURNED') {
                                gameState = 'BURNED';
                                globalArmMat.color.setHex(0x111111); 
                                updateUIStatus(gameState, "设备损毁", "开角不足 45°，摆杆遭尾焰烧毁", "warn");
                                createSmokeBurst(-11, 35, 3.6);
                                createSmokeBurst(-11, 35, -3.6);
                                createSmokeBurst(-11, 45, 3.6);
                                createSmokeBurst(-11, 45, -3.6);
                            }
                        }
                    } 
                    else if (dy >= 60) {
                        gameState = 'SUCCESS';
                        updateUIStatus(gameState, "脱落成功", "火箭安全进入预定轨道", "success");
                    }
                }

                if ((gameState === 'SUCCESS' || gameState === 'BURNED') && dy > 130 && !modalShown) {
                    modalShown = true;
                    if (gameState === 'SUCCESS') {
                        showResult('✅ 零秒脱落：完美执行！', '动作行云流水！摆杆开角达到 45° 以上，完美避开了火箭主体与高温尾焰，安全进入轨道！', 'success');
                    } else if (gameState === 'BURNED') {
                        showResult('🔥 设备损毁：烈焰焚身！', '惊险！摆杆虽然躲开了主体(>30°)，但未贴合塔架(>45°)，被几千度的高温尾焰完全烧毁！', 'warn');
                    }
                }
            } 
            else if (gameState === 'CRASHED') {
                scene.position.x = (Math.random() - 0.5) * 0.4;
                scene.position.y = (Math.random() - 0.5) * 0.4;
            }

            renderer.render(scene, camera);
        }
        
        window.switchAppMode('observe');
        showBriefing(); // 在初始化模式后立即打开任务简报
        animate();

    </script>
</body>
</html>
